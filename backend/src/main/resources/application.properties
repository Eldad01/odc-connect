spring.application.name=odc-connect-backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Front Angular autorisé
app.cors.origines-autorisees=${CORS_ORIGINES:http://localhost:4200}

# Pagination : 20 par défaut, 100 au maximum
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Compression gzip des réponses
server.compression.enabled=true
server.compression.min-response-size=1024

# Aucune information technique dans les erreurs
server.error.include-stacktrace=never
server.error.include-message=never

# Journaux (mettre INFO en production)
logging.level.com.odc.backend=DEBUG

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html